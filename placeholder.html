<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صورة بديلة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .placeholder {
            background: linear-gradient(135deg, #E63946 0%, #FFD60A 100%);
            width: 400px;
            height: 400px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            box-sizing: border-box;
        }
        .placeholder-text {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="placeholder-text">
            🖼️ صورة بديلة<br>
            أضف صورتك هنا
        </div>
    </div>
</body>
</html>
